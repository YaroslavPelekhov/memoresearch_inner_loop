global_seed: 2048
max_seq_len: 2048

user: ...
exp_name: dclm_exps
run_name: test_7b_140b_baseline

tensorboard_path: .../tensorboard/${exp_name}
save_folder: .../checkpoints/${exp_name}/${run_name}

eos_token_id: 2
varlen_input: false
enable_async_tp: false  # enables async tensor parallelism
zero_nan_grads: false
tp_size: 1
sp_size:
  - sp_size: 1
    max_seq_len: ${max_seq_len}

# !!! num_attention_heads is mandatory for job_dispatcher_callback callback !!!
num_attention_heads: 32

model_path: .../models_templates/dclm-7b-128k_digit_tokenizer
model:
  name: giga_causal_lm
  init_device: cpu # could be meta
  pretrained: false
  pretrained_model_name_or_path: ${model_path}
  config_overrides:
    max_position_embeddings: ${max_seq_len}

    eos_token_id: ${eos_token_id}
    hidden_size: 4096
    initializer_range: 0.02
    intermediate_size: 11008
    num_attention_heads: 32
    num_hidden_layers: 32
    num_key_value_heads: 32
    rms_norm_eps: 1e-05
    rope_theta: 10000.0

    init_type: dclm

    z_loss_eps: 5e-6  # Z-loss scale, 0.0 by default. Enables Z-loss calculation if value is > 0.
    apply_qk_norm: true  # `false` by default. Enables applying QK normalization before RoPE and attention.

    use_cache: false

    ### non transformers agruments
    tp_size: ${tp_size}
    use_liger: false

    fused_mlp: false
    fused_mlp_checkpoint_lvl: 0
    activation_checkpoint_layers_num: null

    loss_inplace_backward: false

    attention_hidden_size: null # if null, then attention_hidden_size = hidden_size
    attention_bias: false # if true, then enables biases in Q,K,V linear layers
    # freeze_non_embed: false # if true, then freezes all giga weights except embed weights. It only works with giga model.

    attention_type: LlamaAttention  # Use LlamaPackedRingAttention to use ring attention implementation in SP case
    # attention_type: LlamaPackedAttention  # Use LlamaPackedRingAttention to use ring attention implementation in SP case

    # # MLA
    # attention_type: LlamaLatentAttention
    # apply_torch_compile_to_projections: true
    # use_custom_rotary_kernel: true  # false by default
    # qk_nope_head_dim: 64
    # qk_rope_head_dim: 64
    # v_head_dim: 128
    # kv_lora_rank: 512  # x8 smaller hidden_size
    # q_lora_rank: 1024  # x4 smaller hidden_size

    # use_mtp: true
    # mtp_predictor_num: 1
    # mtp_loss_weight: 0.3
    # mtp_loss_1lm_head: false

    # # MLA
    # attention_type: LlamaLatentAttention
    # apply_torch_compile_to_projections: true
    # use_custom_rotary_kernel: false
    # qk_nope_head_dim: 64
    # qk_rope_head_dim: 64
    # v_head_dim: 128
    # kv_lora_rank: 1024  # x4 smaller hidden_size
    # q_lora_rank: 2048  # x2 smaller hidden_size
    # # kv_lora_rank: 512  # x8 smaller hidden_size
    # # q_lora_rank: 1024  # x4 smaller hidden_size

    parallel_embedding_type: EmbeddingParallelEmbedding  # in case of tp_size > 1, can be set to VocabParallelEmbedding (not recommended)

    # # rope scaling example
    # rope_scaling:
    #   factor: 8.0
    #   low_freq_factor: 1.0
    #   high_freq_factor: 4.0
    #   original_max_position_embeddings: 8192
    #   rope_type: "llama3"

# Tokenizer
tokenizer:
  name: ${model_path}

global_train_batch_size: 2048  # ~4.2M tokens
device_train_microbatch_size: 2
device_eval_batch_size: 1

max_duration: 33500ba # 140B tokens
eval_interval: 1500ba
eval_before_train: regular # one of [skip, force, regular]
eval_subset_num_batches: -1

# Dataloaders
train_loader:
  name: text
  eos_token_id: ${eos_token_id}
  sft_mode: false
  dataset:
    epoch_size: 1062M  # 8.7T tokens epoch
    fim_rate: 0.0
    streams:
      # MULTILING
      dclm-baseline:
          local: .../tokenized_data/8k_context_128k_digit_tokenizer
          proportion: 100.0
          split: dclm-baseline-1.0
    shuffle: true
    max_seq_len: ${max_seq_len}
    shuffle_seed: ${global_seed}
  drop_last: true
  num_workers: 1

# Optimization
scheduler:
  name: cosine_with_warmup
  t_warmup: 5000ba
  alpha_f: 0.015  # 3e-5 final LR

optimizer:
  name: decoupled_adamw
  lr: 2.0e-3
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 1.0e-4  # wd_article * lr = 0.05 * 2e-3
  # param_groups:
  #   - param_str_match: "norm"
  #     lr: 1e-4
  #     weight_decay: 0.0
  #   - param_str_match: "lm_head"
  #     lr: 6e-4
  #     weight_decay: 6.0e-5
  # disable_grad: ["layers.1", "layers.5.self_attn.qkv", "model.norm"]

# Algorithms
algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

# BENCHMARKS
cached_datasets_directory_template: .../metrics_cache # default paths are already in scripts/train.py

# Allows you to aggregate metrics using gauntlet_tags
eval_gauntlet:
  weighting: EQUAL
  # this allows you to average aggregations from gauntlet_tags
  averages:
    ru_en_average:
    - ru
    - en

icl_tasks:
  - label: mmlu
    dataset_uri: .../metrics/mmlu
    # each num_fewshot is separate dataloader
    num_fewshot: [0, 5]
    icl_task_type: mmlu
    ####################
    # only for mmlu
    # be careful, because the settings
    # applied to all dataloaders in this tasks
    num_workers: 1
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: false
    max_seq_len: 4096
    gauntlet_tags: ['en']
    ####################
  - label: teenmmlu
    dataset_uri: .../metrics/mmlu
    # each num_fewshot is separate dataloader
    num_fewshot: [0, 5]
    icl_task_type: teenmmlu
    ####################
    # only for mmlu
    # be careful, because the settings
    # applied to all dataloaders in this tasks
    num_workers: 1
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: false
    max_seq_len: 4096
    gauntlet_tags: ['en']
    ####################
  - label: mmlu-pro
    dataset_uri: .../metrics/mmlu-pro
    # each num_fewshot is separate dataloader
    num_fewshot: [0, 5]
    icl_task_type: mmlu
    choice_num2symbol:
       0: A
       1: B
       2: C
       3: D
       4: E
       5: F
       6: G
       7: H
       8: I
       9: J
    ####################
    # only for mmlu
    # be careful, because the settings
