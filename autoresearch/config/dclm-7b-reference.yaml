# Checkpoint to local filesystem or remote object store
save_interval: 1500ba
# If specified only every `stable_save_interval`-th checkpoint will be considered as "stable" and preserved
# the rest will be considered as "quick" and deleted after the creation of a new checkpoint
# `stable_save_interval` must be divisible by `save_interval`
# note: only checkpoints created during a given launch will be deleted
stable_save_interval: 3000ba

load_weights_only: false
# save_num_checkpoints_to_keep: 1  # Important, this cleans up checkpoints saved to DISK
# save_folder: s3://my-bucket/my-folder/{run_name}/checkpoints

# System
seed: ${global_seed}
precision: amp_bf16
dist_timeout: 1800

# ---- Select ONE fsdp setup ----
# ---- Comment another one ----

# gigaFSDP
gigafsdp_config:
  load_monolith_rank0_only: false
  state_dict_type: local
  sync_module_states: false
  all_reduce_grads_across_model_parallel_group: ${enable_async_tp}
  # --- optional gigafsdp params ---
  # hpz_first_layers_num: 40
  # hpz_group_size: 4
  hybrid_group_size: 8
  # save_gigafsdp_sharded_folder_path: "..."
  # zero_stage: 3  # zero-1 and zero-2 are also available

  activation_checkpointing: false
  activation_checkpointing_reentrant: false
  mixed_precision:
    param_dtype: bf16
    buffer_dtype: fp32
    reduce_dtype: fp32

# FP8
# fp8_config:
#   wrappers:
#     - keep_hp_layers: ["lm_head", "down_proj", "up_proj", "gate_proj"] # down_proj, ...
#       fp8_strategy: all_tensorwise # (all_tensorwise, all_axiswise, lw_axiswise_with_gw_hp)
#       force_recompute_fp8_weight_in_bwd: True # disable it with full activation_checkpointing
#       exclude_layer: True
#     - keep_hp_layers: ["down_proj", "up_proj", "gate_proj"]
#       fp8_strategy: all_tensorwise
#       force_recompute_fp8_weight_in_bwd: False
#       exclude_layer: False # include only this type of layers in fp8
#   enable_compiler: True

# Logging
progress_bar: false
log_to_console: true
console_log_interval: 20ba

callbacks:
  speed_monitor:
    window_size: 10
  stage_time_profiler: {}
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}
  optimizer_monitor:
    batch_log_interval: 100
  # activation_monitor:
  #   interval: 100ba
  #   only_log_wandb: false
  #   keep_only_module_types: ['qkv_proj', 'o_proj', 'down_proj']
  #   ignore_module_types: ['_tp_linear_submodule']
  #   log_module_output: false # log module output or not (by default we log only input to selected modules)
  #   log_gradients: true
  #   log_grad_input: false # log grad_input at backward or not (by default we log only grad_output of selected modules)
  #   stat_list: ['amax', 'amean'] # 'min', 'amin', 'l2norm', average, kurtosis
  scheduled_gc:
    batch_interval: 1000
  training_metrics_monitor:
    batch_log_interval: 500
  # mono_ckpt_saver:
  #   batch_interval: ${save_interval}
  #   save_folder: ${save_folder}
  # memory_stats_saver:
  #   collect_memory_snapshot: true
  #   folder: '${tensorboard_path}/{run_name}/memory_stats_saver'
  #   save_interval: 2ba
  # ema_weights:
  #   alpha: 0.01
  #   update_period: 10
  #   start_batch: 1

auto_log_hparams: false
autoresume: true

# Save checkpoint asynchronously during training
save_checkpoint_async: true
# Compute hashes for saved/loaded checkpoints and check for corruption
compute_checkpoint_hashes: true

date: null
loggers:
  tensorboard:
    log_dir: ${tensorboard_path}
    rank_zero_only: true
  # wandb:
  #   name: ${run_name}-${date}
  #   project: ${exp_name}
  #   group: null
  #   entity: null
  #   tags: null
  #   log_artifacts: false
  #   rank_zero_only: true
  #   init_kwargs:
  #     notes: "Heya"
  #     config: null

# If the parameters of your model do not fully match the parameters of the checkpoint,
# this will lead to an error in load_state_dict or sharding process (with gigafsdp).
# If your model has additional parameters that are initialized separately and not loaded via load_path,
# then you need to set false here.
load_strict_model_weights: true

# Load from local filesystem or remote object store
# load_path: ...
