# @package _global_

defaults:
  - repo_harness
  - override /parent_selector: repeat_single
  - override /stopper: max_generations
  - _self_

problem:
  name: llm_foundry_autoresearch

memory_root: ${oc.env:AUTORESEARCH_MEMORY_DIR,${hydra:runtime.output_dir}/evidence}
extracted_checkpoint_dir: ${memory_root}/extracted
approved_checkpoint_dir: ${memory_root}/approved
review_dir: ${hydra:runtime.output_dir}/review

# The outer campaign owns the research idea. Inner evolution only searches for
# better implementations of the fixed active idea.
pre_step_hook: null
post_step_hook:
  _target_: autoresearch.gigaevo_hooks.ReviewedMemoryPostStepHook
  storage: ${ref:redis_storage}
  checkpoint_dir: ${extracted_checkpoint_dir}
  approved_checkpoint_dir: ${approved_checkpoint_dir}
  review_dir: ${review_dir}
  review_mode: auto
  poll_interval_seconds: 0.1
  memory_provider: null
  primary_key: ${primary_key}
  task_description: ${ref:problem_context::task_description}
  source_repo: ${repo_harness.source_repo}

num_parents: 1
max_elites_per_generation: 1
max_mutations_per_generation: 1
island_max_size: 1
primary_resolution: 1
enable_migration: false
dag_concurrency: 1
max_concurrent_dags: 1

repo_harness:
  source_repo: ${oc.env:AUTORESEARCH_REPO,${hydra:runtime.cwd}}
  seed_ref: ${oc.env:AUTORESEARCH_SEED_REF,HEAD}
  entrypoint: autoresearch/model/gdn.py
  mutation_backend:
    _target_: gigaevo.repo_harness.backends.CommandCodingAgentBackend
    name: codex
    stdin_prompt: true
    service_tier: ${oc.env:CODEX_SERVICE_TIER,standard}
    context_tier: ${oc.env:CODEX_CONTEXT_TIER,short}
    command:
      - ${hydra:runtime.cwd}/tools/codex-proxy
      - exec
      - --model
      - ${oc.env:CODEX_MODEL,gpt-5.6-sol}
      - --ephemeral
      # Each agent runs in a disposable Git worktree and the harness rejects
      # changes outside allowed_changed_files. The host cannot create bwrap's
      # loopback network namespace, so Codex's own sandbox must be disabled.
      - --dangerously-bypass-approvals-and-sandbox
      - --skip-git-repo-check
      - --cd
      - "{worktree}"
      - "-"
  allowed_changed_files:
    - autoresearch/model/gdn.py
  active_idea_path: ${oc.env:AUTORESEARCH_ACTIVE_IDEA_PATH}
  recent_failure_path: ${oc.env:AUTORESEARCH_PROMOTION_STATE_PATH}
  smoke_commands:
    - ["${python_executable:}", tools/run-autoresearch-smoke.py, --batches, "128", --run-dir, runs/codex-smoke, --check-file, autoresearch/model/gdn.py, --gpus, "1", --train-microbatch-size, "${oc.env:AUTORESEARCH_TRAIN_MICROBATCH_SIZE,16}", --eval-batch-size, "${oc.env:AUTORESEARCH_EVAL_BATCH_SIZE,32}", --loader-workers, "${oc.env:AUTORESEARCH_LOADER_WORKERS,8}", --gradient-log-interval, "${oc.env:AUTORESEARCH_GRADIENT_LOG_INTERVAL,20}", --disable-optimizer-metrics]
  smoke_timeout: 900
  mutation_timeout: 2400
  benchmark_command:
    - ${python_executable:}
    - tools/run-multifidelity-autoresearch-benchmark.py
    - --multifidelity-plan
    - ${oc.env:AUTORESEARCH_MULTIFIDELITY_PLAN,config/multifidelity/dclm-140m.yaml}
    - --commit
    - "{commit}"
    - --run-dir
    - ${oc.env:AUTORESEARCH_RUN_ROOT,${hydra:runtime.output_dir}/implementations}/impl-{commit}/training
    - --gpus
    - ${oc.env:AUTORESEARCH_GPUS_PER_CANDIDATE,1}
    - --train-microbatch-size
    - ${oc.env:AUTORESEARCH_TRAIN_MICROBATCH_SIZE,16}
    - --eval-batch-size
    - ${oc.env:AUTORESEARCH_EVAL_BATCH_SIZE,32}
    - --loader-workers
    - ${oc.env:AUTORESEARCH_LOADER_WORKERS,8}
    - --gradient-log-interval
    - ${oc.env:AUTORESEARCH_GRADIENT_LOG_INTERVAL,20}
    - --disable-optimizer-metrics
  benchmark_timeout: ${oc.decode:${oc.env:AUTORESEARCH_BENCHMARK_TIMEOUT,43200}}
  staged_validation:
    enabled: false

stage_timeout: ${oc.decode:${oc.env:AUTORESEARCH_STAGE_TIMEOUT,43800}}
dag_timeout: ${oc.decode:${oc.env:AUTORESEARCH_DAG_TIMEOUT,44400}}
