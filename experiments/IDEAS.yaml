- id: adversarial_013
  title: "K=5 compute budget + loose coupling (combined best-bet)"
  task: heilbron
  status: queued
  rank: 0.58
  started_experiment: "heilbron/k5-budget-loose (INVALID); superseded by k5-budget-v3 (INCONCLUSIVE, confounded)"
  hypothesis: >
    Improver stagnation (confirmed 8 experiments) is caused by insufficient
    compute budget. v1's accidental loose coupling (min_delta=1) gave D many
    micro-steps per G epoch — an implicit compute asymmetry — and produced
    the best-ever results (>=105% SOTA). v2's tight coupling (min_delta=8)
    removed this implicit asymmetry and underperformed despite 4-6x more
    generations. Combining EXPLICIT budget asymmetry (K=5,
    max_mutations_per_generation=40 for D) with loose coupling (min_delta=1)
    gives both the explicit compute advantage AND the timing flexibility that
    produced v1's peaks. This is the highest-information single experiment
    available: it tests the only untested intervention class (compute budget)
    under the coupling regime that produced the best prior results.
  mechanism: >
    Config-only: Improver max_mutations_per_generation=40, Constructor=8.
    ProgressBasedSyncHook with min_delta=1 (loose coupling). Standard
    adversarial_coevo pipeline. No source code access, no composition,
    no gradient-in-prompt — isolate budget + coupling from information flow.
  expected_effect: "Improver acceptance rate >5% after gen 20. Constructor actual_fitness >= 0.03449. Best pair >= 0.03650 (v1 peak)."
  estimated_cost: "2 arms x 4 pairs = 16 runs, gen 50, ~48h"
  source: "retrospective (2026-04-16)"
  created: "2026-04-16"
  builds_on:
  - heilbron/asymmetric-iterations
  - heilbron/asymmetric-iterations-v2
  - heilbron/baseline-repro
  contradicts: []
  alternative_to:
  - adversarial_010
  notes: >
