- id: adversarial_018
  title: "Pareto coevolution (DECA/IPCA) escalation"
  task: heilbron
  status: queued
  rank: 0.42
  hypothesis: >
    If adversarial_015 (REDESIGN bundle) fails to break D collapse or
    lift G actual_fitness, the ceiling is not in the fitness smoothness
    but in the scalar-fitness assumption itself. DECA (de Jong 2005) and
    IPCA (de Jong & Pollack 2004) replace scalar fitness with Pareto
    fronts over opponents, preventing cycling and engagement loss that
    single-objective coevolution cannot escape. This is the recognized
    escalation path flagged in experiments/heilbron/k5-budget-loose/REDESIGN.md.
  mechanism: >
    New Python (~200-400 LOC): Pareto-archive selection, DECA-style
    distinction-based scoring, IPCA-style informativeness test. Replaces
    scalar fitness HoF selection with Pareto-non-dominated set. New
    module gigaevo/adversarial/pareto.py and config hooks.
  expected_effect: >
    G mean actual_fitness >= 0.03449 baseline parity AND D collapse
    eliminated WITHOUT fitness smoothing. Or: engagement metric (D
    strategy-rejection rate across generations) stays > 20% where
    scalar REDESIGN drifts toward 0.
  estimated_cost: "Engineering: 2-4 weeks. Runs: 4 arms × 2 pairs = 8 runs × gen 50, ~24h."
  source: "retrospective (2026-04-19)"
  created: "2026-04-19"
  builds_on:
  - adversarial_015  # only if 015 NULL
  contradicts: []
  alternative_to:
  - adversarial_015
  notes: >
    CONTINGENT-ON-NULL-REDESIGN: launch ONLY if adversarial_015 pre-registered
    failure criteria trigger (smoothed arms still collapse OR G < 95%
