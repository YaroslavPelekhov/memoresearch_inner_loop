- id: adversarial_009
  title: "WGAN-GP iteration ratio: K Improver generations per Constructor generation"
  task: heilbron
  status: done
  rank: 0.95
  hypothesis: >
    Improver stagnation (confirmed 6 experiments) is caused by insufficient
    computational budget: 8 mutations per generation is too few to find improvements
    on near-optimal Constructor solutions. Increasing Improver mutations to K*8 per
    generation (WGAN-GP analog) gives the Improver K× more exploration budget
    while the Constructor is frozen — exactly matching the GAN training insight
    that D needs more iterations than G. All prior interventions changed information,
    none changed compute budget — this is the first to target budget asymmetry.
  mechanism: >
    Config-only change: set max_mutations_per_generation=K*8 for Improver runs.
    MainRunSyncHook naturally blocks Constructor while Improver churns.
    Zero code changes required.
  expected_effect: "Improver acceptance rate >5% after gen 20. Constructor actual_fitness >= baseline (0.03464)."
  estimated_cost: "2 arms × 3 pairs = 12 runs, gen 50, ~72h"
  source: "human (WGAN-GP analogy)"
  created: "2026-04-12"
  builds_on:
  - adversarial/heilbron-prover
  - heilbron/baseline-repro
  - adversarial/adversarial-vs-solo
  contradicts: []
  alternative_to:
  - adversarial_003
  notes: >
    PARTIALLY TESTED. heilbron/asymmetric-iterations redesigned the mechanism
    (source code access + feedback modes) but K=5 was amended to K=1. Compute
    budget was NOT tested. Both arms produced >=105% SOTA (0.03648, 0.03650) but
    stagnation persisted. Information-architecture changes help Constructor but
    do not break Improver stagnation. The budget hypothesis remains open.
  literature_refs:
  - "WGAN-GP (Gulrajani et al. 2017) — n_critic=5 standard"
  - "Competitive coevolution (Ficici & Pollack 2003) — asymmetric evaluation budget"
  started_experiment: "heilbron/asymmetric-iterations"
  result: "PARTIAL — K=5 NOT tested (K=1 amendment). Both arms >=105% SOTA. Stagnation persists."
  result_experiment: "heilbron/asymmetric-iterations"
