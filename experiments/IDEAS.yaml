schema_version: 1
ideas:
- id: hover_001
  title: 'Gradient-signal fitness: LLM critique replaces binary improvement signal'
  task: hover
  status: queued
  rank: 0.91
  hypothesis: 'Improver stagnation is caused by binary improvement signal (did fitness
    go up or not?) which provides zero gradient near Constructor optima. Replacing
    with an LLM-generated critique of each attempt (structured: what was tried, why
    it failed, what to try instead) provides richer feedback that breaks stagnation.

    '
  mechanism: New fitness shaping hook in PostRunHook that generates LLM critique per
    iteration
  expected_effect: Constructor fitness +2-5pp; Improver un-stagnates
  estimated_cost: 4 runs × 50 gen
  source: retrospective
  created: '2026-04-09'
  builds_on: []
  contradicts: []
  alternative_to:
  - hover_002
  notes: 'Confirmed pattern: ''Improver stagnation is structural, not feedback-dependent''
    (3 adversarial experiments). But ALL prior attempts used CODE feedback (K=1, K=3).
    This idea proposes CRITIQUE feedback instead, which is different in kind.

    '
  literature_refs:
  - TextGrad (Yuksekgonul et al. 2024) — gradient through text
  - OPRO (Yang et al. 2023) — LLM as optimizer
- id: hover_002
  title: 'Parsed adversarial critique: K=3 with structured parsing before injection'
  task: hover
  status: queued
  rank: 0.83
  hypothesis: 'Opponent context minimum effective dose is K≥3 (confirmed). But raw
    K=3 code injection may cause LLM over-anchoring. Parsing the opponent code into
    a structured critique (topology decisions, retrieval choices, key differences)
    before injecting provides the right level of abstraction — enough to guide mutation,
    not enough to copy.

    '
  mechanism: New prompt preprocessing step in adversarial mutation operator
  expected_effect: Improver fitness +3-8pp over K=3 baseline
  estimated_cost: 4 runs × 50 gen
  source: retrospective
  created: '2026-04-09'
  builds_on:
  - hover_adversarial_v2
  contradicts: []
  alternative_to:
  - hover_001
  notes: 'Pattern: K=3 > K=0 > K=1. Ordering suggests structured context > raw code.'
  literature_refs:
  - R&D-Agent (Chen et al. 2024) — separate research from development
- id: hover_003
  title: 'Topology curriculum: start 2-hop, unlock 3-hop after fitness plateau'
  task: hover
  status: queued
  rank: 0.76
  hypothesis: 'Dynamic topology is confirmed to work (+8.5pp). But evolution may get
    stuck in 2-hop local optima because 3-hop is harder to improve. A curriculum that
    starts with 2-hop only and unlocks 3-hop after gen 10 (or fitness plateau) may
    produce better final chains.

    '
  mechanism: Fitness-triggered topology unlock in validate.py or custom stage
  expected_effect: +3-6pp over static dynamic topology
  estimated_cost: 4 runs × 60 gen
  source: retrospective
  created: '2026-04-09'
  builds_on: []
  contradicts: []
  alternative_to: []
  notes: Inspired by curriculum learning literature.
  literature_refs:
  - Bengio et al. 2009 — curriculum learning
- id: hover_004
  title: 'Steady-state with MAP-Elites soft archive: fitness+diversity co-optimization'
  task: hover
  status: queued
  rank: 0.71
  hypothesis: 'Current steady-state engine uses MAP-Elites with a single fitness metric.
    Adding a diversity dimension (e.g., retrieval depth distribution, program AST
    distance) to the archive cells may produce more robust programs and avoid fitness
    plateaus.

    '
  mechanism: New behavior characterization function + expanded archive cell definition
  expected_effect: +2-4pp and lower variance across runs
  estimated_cost: 4 runs × 50 gen
  source: literature
  created: '2026-04-09'
  builds_on: []
  contradicts:
  - hover_map_elites_topology
  alternative_to: []
  notes: 'Prior experiment hover/map-elites-topology was NULL (p=0.413). That used
