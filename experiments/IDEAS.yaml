- id: adversarial_015
  title: "REDESIGN bundle: smoothed tanh fitness + deterministic HoF + K=L=3"
  task: heilbron
  status: queued
  rank: 0.97
  hypothesis: >
    Improver stagnation across 10 heilbron experiments has a single root
    cause (confirmed 2026-04-16): the D fitness formula
    `min(max(delta, 0.0) / Q_MAX, 1.0)` (pop_b/evaluate.py:78) clamps every
    non-winning comparison to exactly 0.0, producing a 60-90% point mass
    empirical across k5-budget-loose D populations. G's mirror formula
    `float(delta <= 0)` (pop_a/evaluate.py:95) is binary per opponent,
    masked by the 50% intrinsic-quality term. All prior information-flow,
    coupling, and compute-budget interventions ran on top of this broken
    fitness landscape — their NULL results are expected, not diagnostic.
    The REDESIGN bundle (smoothed tanh fitness for both populations,
    deterministic top-K HoF, K=L=3, archive_reeval=true, cache_on edges)
    targets the actual bottleneck. If positive, the entire intervention
    space reopens for valid re-testing. If negative, we have a
    fundamental ceiling, not a signal problem.
  mechanism: >
    Code + config: ~40-70 LOC from experiments/heilbron/k5-budget-loose/REDESIGN.md.
    (1) pop_b/evaluate.py:78 — replace hard-floor with `(tanh(delta/Q_MAX) + 1) / 2`.
    (2) pop_a/evaluate.py:95 — replace binary resistance with smoothed per-opponent score
    then average. (3) Deterministic `get_top_k` HoF selector replacing stochastic softmax.
    (4) Config: K=L=3, archive_reeval=true, cache_on edges via CacheOnlyInput model.
    (5) 2x2 factorial (fitness × feedback) to include known-NULL feedback axis as
    internal-consistency calibration.
  expected_effect: >
    D fitness distribution at gen 25 has NO 0.0 point mass (empirical: each D
    population shows CV > 0.10 across niches). G mean actual_fitness at gen 50
    >= 0.03449 (v2 baseline parity). Stretch: best pair >= 0.03650 (v1 peak).
  estimated_cost: "4 arms × 2 pairs = 8 runs, gen 50, ~24h wall-clock"
  source: "retrospective (2026-04-19)"
  created: "2026-04-19"
  builds_on:
  - heilbron/k5-budget-loose
  - heilbron/k5-budget-v3
  contradicts:
  - heilbron/adversarial-dynamic-updates  # re-tests archive_reeval under smoothed fitness
  alternative_to:
  - adversarial_013  # K=5 budget cannot be interpreted until fitness is fixed
  notes: >
    BLOCKING PRIORITY. All other heilbron ideas (adversarial_010, 012, 013,
    014, 016, 017) are contingent on this. Pre-registered success: smoothed
    arms lose the D 0.0 point mass AND G >= baseline parity. Pre-registered
    failure: smoothed arms still show D collapse OR G < 95% baseline (then
    escalate to adversarial_018 Pareto). Prerequisites: KF-07 deadlock
    guard, KF-08 archive pipeline extra=ignore, KF-09 gen-0 persistence gap,
    pre-registered max_runtime_hours cap. Ensure diagnose.py treatment
    verification catches the case where RedesignFitnessCalculator never
    instantiates (silent fallback class).
  literature_refs:
  - "WGAN-GP (Gulrajani et al. 2017) — continuous critic output avoids gradient collapse"
  - "Competitive coevolution (Ficici & Pollack 2003) — engagement-preserving objectives"
  - "Pareto coevolution (de Jong 2005) — smoothed dominance as selection signal"
