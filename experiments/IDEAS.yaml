    selection infrastructure) justifies the strict gating. Volkov concern:
    Pareto selection interacts with MAP-Elites in non-trivial ways — prior
    art is on standard GAs, not MAP-Elites coevolution.
  literature_refs:
  - "DECA (de Jong 2005) — distinction-based Pareto coevolution"
  - "IPCA (de Jong & Pollack 2004) — informativeness Pareto archive"
  - "Ficici & Pollack (2003) — Pareto coevolution theory"
- id: heilbron-g-side-lineage-filter
  task: heilbron
  status: proposed
  source: docs/superpowers/specs/2026-04-21-shared-benchmark-filtered-lineage-design.md
  rationale: |
    G-side LineageStage currently feeds parent-G → child-G transitions to
    the LLM without filtering on shared D opponents. G's quality-half
    (min_area / 0.0365) is HoF-invariant by construction, so the payoff
    of filtering on tracker.faced_by_g is smaller than the D-side case.
    Revisit if an ablation shows the resistance half is driving
    decisions. Implementation would subclass LineageStage analogously to
    SharedBenchmarkFilteredLineageStage but read tracker.faced_by_g /
    metrics_by_g instead.
