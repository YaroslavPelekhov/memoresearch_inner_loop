version: 1
description: >
  Repo-harness seed repository for the Heilbronn triangle problem. The candidate
  artifact is solution.py, which must implement entrypoint() and return an
  11-by-2 NumPy coordinate array inside the unit-area equilateral triangle.
  This is a closed-book task: mutation agents must not use internet search,
  external coordinate tables, published solutions, or remembered exact
  Heilbronn configurations.
  Mutation agents should make concise algorithmic changes and avoid long local
  evaluations or broad coordinate-search runs; the GigaEvo outer loop performs
  candidate evaluation and selection.
default_variant: grid
variants:
  grid:
    description: Mildly perturbed triangular grid baseline.
    files:
      README.md:
        content: |
          # Heilbron Repo-Harness Seed

          Implement `entrypoint()` in `solution.py`. It must return an
          `(11, 2)` NumPy array of points inside the unit-area equilateral
          triangle. The benchmark imports the canonical task helper and
          validator from `problems/heilbron`.

          Closed-book rule: do not use internet search, external coordinate
          tables, published solutions, or remembered exact Heilbronn
          configurations. Derive candidates from this repository, the local
          benchmark feedback, and local computation only.

          Mutation guidance: make concise algorithmic changes to `solution.py`.
          Do not spend mutation time on long local evaluations, broad numerical
          searches, or expensive multi-start optimization runs. A single cheap
          benchmark or sanity check is enough; GigaEvo will evaluate candidates.
      solution.py:
        content: |
          import random

          from helper import get_unit_triangle
          import numpy as np

          np.random.seed(42)
          random.seed(42)


          def entrypoint() -> np.ndarray:
              tri = get_unit_triangle()
              A, B, C = tri
              points = []
              rows = 5
              count = 0
              for row in range(rows):
                  num_points = rows - row
                  v = (row + 0.5) / rows
                  for i in range(num_points):
                      if count >= 11:
                          break
                      u = (i + 0.5) / num_points * (1 - v)
                      P = (1 - u - v) * A + u * B + v * C
                      perturbation = np.random.uniform(-0.001, 0.001, size=2)
                      P = P + perturbation
                      points.append(P)
                      count += 1
                  if count >= 11:
                      break
              return np.array(points)
