  cost:
    description: Average reported LLM cost per Terminal-Bench 2 trial when available.
    decimals: 4
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 1000.0
    include_in_prompts: true
    significant_change: 0.05
    sentinel_value: 1000.0
