specs:
  fitness:
    description: Terminal-Bench 2 pass rate across evaluated trials.
    decimals: 4
    is_primary: true
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: -1000.0
  is_valid:
    description: Whether the Terminal-Bench 2 evaluation produced usable trial results.
    decimals: 0
