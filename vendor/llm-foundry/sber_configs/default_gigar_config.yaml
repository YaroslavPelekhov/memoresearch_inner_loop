auto_log_hparams: false
autoresume: true

# Save checkpoint asynchronously during training
save_checkpoint_async: false
# Compute hashes for saved/loaded checkpoints and check for corruption
compute_checkpoint_hashes: true

# If the parameters of your model do not fully match the parameters of the checkpoint,
# this will lead to an error in load_state_dict or sharding process (with gigafsdp).
# If your model has additional parameters that are initialized separately and not loaded via load_path,
# then you need to set false here.
load_strict_model_weights: true

# Load from local filesystem or remote object store
# load_path: /home/jovyan/vmamedov/checkpoints_prod/gigar2_29B_8k/ep1-ba626000-rank0-tokenizer-extended-64.pt
# load_path: s3://my-bucket/my-folder/gpt-7b/checkpoints/latest-rank{rank}.pt

# BENCHMARKS
#cached_datasets_directory_template: null # default paths are already in scripts/train.py

# Allows you to aggregate metrics using gauntlet_tags
eval_gauntlet:
  weighting: EQUAL
  # this allows you to average aggregations from gauntlet_tags
  averages:
    ru_en_average:
    - ru
    - en

icl_tasks:
  - label: mmlu
    dataset_uri: /home/jovyan/vmamedov/mmlu/all
    # each num_fewshot is separate dataloader
    num_fewshot: [0, 5]
    icl_task_type: mmlu
    ####################
    # only for mmlu
    # be careful, because the settings
    # applied to all dataloaders in this tasks
    num_workers: 1
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: false
    max_seq_len: 4096
    # it can have one, several, or none values.
    gauntlet_tags: ['en']
