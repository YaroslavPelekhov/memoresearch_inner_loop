timers:
  # timers_threshold is an upper bound on timer levels to aggregate statistics:
  # timer_level = 0 - all timers disabled
  # timer_level = 1 - aggregates avg and calls every interval steps
  # timer_level = 2 - aggregates avg, calls, min and max every interval steps
  # timer_level = 3 - aggregates avg, calls, min, max and interrank aggregation every interval steps
  # if timer_level > timers_threshold, timer_level will be decreased to timers_threshold
  timers_threshold: 1
  interval: 50            # timers aggregation interval, causes CPU-GPU syncs for CUDA-timers and for timers_threshold == 3 does collective communications

callbacks:
