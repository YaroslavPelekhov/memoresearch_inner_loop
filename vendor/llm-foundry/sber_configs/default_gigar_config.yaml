# Optimization
scheduler:
  name: cosine_with_warmup
  t_warmup: 2000ba
  alpha_f: 0.1

optimizer:
  name: decoupled_adamw
  lr: 3.0e-4
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 3.0e-5  # wd_article * lr = 0.1 * 3e-4

  # only decoupled_fused_adamw params
  # state_dtype: float
  # num_layers_compile: 2

  # param_groups:
  #   - param_str_match: "norm"
  #     lr: 1e-4
  #     weight_decay: 0.0
  #   - param_str_match: "lm_head"
  #     lr: 6e-4
  #     weight_decay: 6.0e-5
  # disable_grad: ["layers.1", "layers.5.self_attn.qkv", "model.norm"]

# Algorithms
algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

profiler:
  use_profiler: false
  ranks_to_profile: [0, 1]  # list of ranks to profile, if "all" or empty, will profile all ranks
  annotation:
    enable: true
    backend: "record_function"  # available annotation backends: "nvtx", "torch_nvtx" or "record_function"
    # NOTE:
    # nvtx requires installed package nvxt
    # torch_nvtx annotation works only with nsight systems
  trace_handlers:
    - name: json
      params:
      # composer.profiler.JSONTraceHandler kwargs
        folder: ${tensorboard_path}/${run_name}/composer_profiler
        merged_trace_filename: null
        merged_trace_remote_file_name: null
        overwrite: true
        num_traces_to_keep: -1

  cyclic_schedule:
    # composer.profiler.cyclic_schedule kwargs
    #  Number of batches to skip profiling at epoch start
    skip_first: 110
    #  For each profiling cycle, number of batches to skip at the beginning of the cycle.
    wait: 10
    #  For each profiling cycle, number of batches to be in the warmup state after skipping
    #   ``wait`` batches
    warmup: 2
    #  For each profiling cycle, number of batches to record after warming up.
    active: 2
    #  Number of profiling cycles to perform per epoch
    repeat: 1

  profiler_overrides:
    # composer.profiler.Profiler kwargs
    # BASE
    torch_prof_folder: ${tensorboard_path}/${run_name}/torch_profiler
    torch_prof_overwrite: true
    torch_prof_num_traces_to_keep: -1
    sys_prof_stats_thread_interval_seconds: 0.5
    # METRICS
    # sys
    sys_prof_cpu: false
    sys_prof_memory: false
    sys_prof_disk: false
    sys_prof_net: false
    # torch
    torch_prof_record_shapes: false
    torch_prof_profile_memory: false
    torch_prof_with_stack: false
    torch_prof_memory_filename: null


max_duration: 750000ba # 3Т tokens
eval_interval: 1000ba
eval_before_train: regular # one of [skip, force, regular]
eval_subset_num_batches: -1

# Checkpoint to local filesystem or remote object store
save_interval: 1000ba
# If specified only every `stable_save_interval`-th checkpoint will be considered as "stable" and preserved
# the rest will be considered as "quick" and deleted after the creation of a new checkpoint
# `stable_save_interval` must be divisible by `save_interval`
# `stable_save_interval` must be set to null if not used
# note: only checkpoints created during a given launch will be deleted
stable_save_interval: null

load_weights_only: false
# save_num_checkpoints_to_keep: 1  # Important, this cleans up checkpoints saved to DISK
# save_folder: s3://my-bucket/my-folder/{run_name}/checkpoints

# System
seed: ${global_seed}
precision: amp_bf16
dist_timeout: 1800

# ---- Select ONE fsdp setup ----
